<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <rect width="100%" height="100%" fill="white"/>
  <text x="60" y="80" font-family="Arial, sans-serif" font-size="42" fill="black">Per-order geometric</text>
  <text x="60" y="150" font-family="Times New Roman, serif" font-size="52" fill="black">w₁ = 1</text>
  <text x="60" y="215" font-family="Times New Roman, serif" font-size="52" fill="black">wᵢ = wᵢ₋₁ × Mᵢ</text>
  <text x="60" y="268" font-family="Arial, sans-serif" font-size="27" fill="black">У каждого уровня свой множитель Mᵢ.</text>
</svg>
